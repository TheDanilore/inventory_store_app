<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inventory_store_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>inventory_store_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Interceptor global de atajos de teclado para ERP en navegadores web.
    // Evita que Chrome / Edge secuestren Ctrl+K (omnibox), Ctrl+N (nueva ventana),
    // Ctrl+1..4 (pestañas), Ctrl+P (imprimir), etc., permitiendo que Flutter los procese.
    window.addEventListener('keydown', function(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) {
        var key = (e.key || '').toLowerCase();
        if (['k', 'n', 'b', 'p', 's', 'i', 'v', 't', '1', '2', '3', '4'].includes(key)) {
          // Prevenir la acción nativa del navegador web
          e.preventDefault();
        }
      }
    }, { capture: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
